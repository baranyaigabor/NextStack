x-security-defaults: &a1
    security_opt:
        - no-new-privileges:true
services:
    statsd:
        <<: *a1
        image: exelban/statsd:latest@sha256:d9e7a7fdeea38dc4780aa29078fd9287521061d7aba51f7edc9b83f84865cdd4
        profiles:
            - statsd
        restart: unless-stopped
        network_mode: host
        volumes:
            - ${STATSD_DATA_DIR:-./statsd}:/root/.statsd
            - /var/run/docker.sock:/var/run/docker.sock:ro
    tunnel_setup:
        <<: *a1
        image: node:22.23.2-alpine@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85
        profiles:
            - tunnel
        restart: no
        command:
            - node
            - /app/cloudflare-tunnel.mjs
        environment:
            APP_DOMAIN: ${PROD_APP_DOMAIN:-${APP_DOMAIN:-}}
            APP_ENVIRONMENT: production
            CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
            CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
            CLOUDFLARE_TUNNEL_NAME: ${PROD_CLOUDFLARE_TUNNEL_NAME:-}
            CLOUDFLARE_ORIGIN_URL: http://proxy:8081
            CLOUDFLARE_TUNNEL_TOKEN_FILE: /run/cloudflare/tunnel-token
        volumes:
            - ./infrastructure/cloudflare-tunnel.mjs:/app/cloudflare-tunnel.mjs:ro
            - cloudflare-runtime:/run/cloudflare
        networks:
            - starter
    cloudflared:
        <<: *a1
        image: cloudflare/cloudflared:2026.10.4@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
        profiles:
            - tunnel
        command: tunnel --no-autoupdate run --token-file /run/cloudflare/tunnel-token
        restart: unless-stopped
        volumes:
            - cloudflare-runtime:/run/cloudflare:ro
        depends_on:
            tunnel_setup:
                condition: service_completed_successfully
            proxy:
                condition: service_healthy
        networks:
            - tunnel
    proxy:
        <<: *a1
        image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
        restart: unless-stopped
        ports:
            - ${PROD_BIND_ADDRESS:-127.0.0.1}:${PROD_HTTP_PORT:-8080}:80
        volumes:
            - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            frontend:
                condition: service_healthy
            backend:
                condition: service_healthy
        networks:
            - starter
            - tunnel
        healthcheck:
            test:
                - CMD-SHELL
                - wget --quiet --tries=1 --spider http://127.0.0.1/api/health || exit 1
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s
    frontend:
        image: ${FRONTEND_IMAGE:-${APP_ID:-fullstack}-frontend:local}
        <<: *a1
        build:
            context: .
            dockerfile: frontend/Dockerfile.prod
            args:
                NEXT_PUBLIC_APP_ID: ${APP_ID}
                NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Fullstack Starter}
                NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
                NEXT_PUBLIC_APP_DESCRIPTION: ${NEXT_PUBLIC_APP_DESCRIPTION:-Your application starts here.}
                NEXT_PUBLIC_APP_DOMAIN: ${APP_DOMAIN:-}
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
                NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-/}
                NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-}
                NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        restart: unless-stopped
        init: true
        read_only: true
        cap_drop:
            - ALL
        pids_limit: 256
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=64m
            - /app/frontend/.next/cache:rw,noexec,nosuid,size=128m
        environment:
            NODE_ENV: production
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - starter
        healthcheck:
            test:
                - CMD-SHELL
                - wget --quiet --tries=1 --spider http://127.0.0.1:3000/ || exit 1
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
    backend:
        image: ${BACKEND_IMAGE:-${APP_ID:-fullstack}-backend:local}
        <<: *a1
        build:
            context: .
            dockerfile: backend/Dockerfile.prod
        restart: unless-stopped
        init: true
        read_only: true
        cap_drop:
            - ALL
        pids_limit: 256
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=64m
        environment:
            NODE_ENV: production
            APP_ID: ${APP_ID}
            APP_NAME: ${APP_NAME:-Fullstack Starter}
            APP_DOMAIN: ${APP_DOMAIN:-}
            BACKEND_PORT: '4000'
            LOG_LEVEL: ${LOG_LEVEL:-info}
            OTEL_ENABLED: ${OTEL_ENABLED:-false}
            OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
            OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
            OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
            OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
            OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
            OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
            OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-}
            OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
            DATABASE_URL: ${COMPOSE_DATABASE_URL:?Use pnpm dev:up or pnpm prod:up}
            RUN_DATABASE_MIGRATIONS: 'false'
            CACHE_URL: redis://cache:6379
            RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
            RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
            SEARCH_ENGINE_URL: http://search_engine:7700
            SEARCH_ENGINE_MASTER_KEY: ${SEARCH_ENGINE_MASTER_KEY}
            VIRUS_SCANNER_HOST: virus_scanner
            VIRUS_SCANNER_PORT: '3310'
            BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost/api/auth}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
            MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
            MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
            MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
            GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
            GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
            FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
            FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
            TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
            STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
            STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
            STRIPE_ALLOWED_PRICE_IDS: ${STRIPE_ALLOWED_PRICE_IDS:-}
            AWS_REGION: ${AWS_REGION:-eu-central-1}
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
            MAIL_FROM: ${MAIL_FROM:-Fullstack Starter <noreply@example.com>}
            SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
            R2_ENDPOINT: ${R2_ENDPOINT:-}
            R2_REGION: ${R2_REGION:-auto}
            R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
            R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
            R2_BUCKET: ${R2_BUCKET:-}
            R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
            APP_URL: ${APP_URL:?Use the pnpm Compose wrapper}
            TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
            NATIVE_AUTH_ENABLED: ${NATIVE_AUTH_ENABLED:-false}
            NATIVE_APP_SCHEME: ${NATIVE_APP_SCHEME:-}
            NATIVE_TRUSTED_ORIGINS: ${NATIVE_TRUSTED_ORIGINS:-}
            EXPO_AUTH_ENABLED: ${EXPO_AUTH_ENABLED:-false}
            EXPO_APP_SCHEME: ${EXPO_APP_SCHEME:-}
            EXPO_WEB_ORIGIN: ${EXPO_WEB_ORIGIN:-}
            TRUST_PROXY_CIDRS: loopback,linklocal,uniquelocal
            SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
            VIRUS_SCAN_ENABLED: ${VIRUS_SCAN_ENABLED:-false}
            MAIL_PROVIDER: ${MAIL_PROVIDER:-disabled}
            SMTP_HOST: ${SMTP_HOST:-}
            SMTP_PORT: ${SMTP_PORT:-1025}
            SMTP_SECURE: ${SMTP_SECURE:-false}
            SMTP_USER: ${SMTP_USER:-}
            SMTP_PASSWORD: ${SMTP_PASSWORD:-}
            R2_FORCE_PATH_STYLE: ${R2_FORCE_PATH_STYLE:-false}
            STORAGE_AUTO_CREATE_BUCKET: ${STORAGE_AUTO_CREATE_BUCKET:-false}
        depends_on:
            db:
                condition: service_healthy
            cache:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        networks:
            - starter
        healthcheck:
            test:
                - CMD-SHELL
                - wget --quiet --tries=1 --spider http://127.0.0.1:4000/api/health ||
                  exit 1
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
    db:
        <<: *a1
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - db-data:/var/lib/postgresql/data
        networks:
            - starter
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s
        command:
            - postgres
            - -c
            - max_connections=200
            - -c
            - shared_buffers=256MB
    cache:
        <<: *a1
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        restart: unless-stopped
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy
            noeviction
        volumes:
            - redis-data:/data
        networks:
            - starter
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 10s
            timeout: 5s
            retries: 10
    search_engine:
        <<: *a1
        image: getmeili/meilisearch:v1.12@sha256:c9fac23131cca4db95173d41cc50fd5639121ee381795528fdd7522d7978a7b8
        restart: unless-stopped
        environment:
            MEILI_ENV: production
            MEILI_MASTER_KEY: ${SEARCH_ENGINE_MASTER_KEY}
            MEILI_NO_ANALYTICS: ${MEILI_NO_ANALYTICS:-true}
            MEILI_HTTP_ADDR: 0.0.0.0:7700
        volumes:
            - search-engine-data:/meili_data
        networks:
            - starter
        healthcheck:
            test:
                - CMD-SHELL
                - wget --quiet --tries=1 --spider http://127.0.0.1:7700/health || exit 1
            interval: 10s
            timeout: 5s
            retries: 10
        profiles:
            - search
    virus_scanner:
        platform: linux/amd64
        <<: *a1
        image: clamav/clamav:1.5.4@sha256:0e31ce089574268aefa0b543767d66b70240ab51ed49eec53e07f18d5629d817
        restart: unless-stopped
        volumes:
            - virus-scanner-data:/var/lib/clamav
        networks:
            - starter
        healthcheck:
            test:
                - CMD
                - /usr/local/bin/clamdcheck.sh
            interval: 15s
            timeout: 10s
            retries: 20
            start_period: 120s
        profiles:
            - scanner
    migrate:
        image: ${BACKEND_IMAGE:-${APP_ID:-fullstack}-backend:local}
        <<:
            security_opt:
                - no-new-privileges:true
        build:
            context: .
            dockerfile: backend/Dockerfile.prod
        restart: no
        init: true
        read_only: true
        cap_drop:
            - ALL
        pids_limit: 256
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=64m
        environment:
            NODE_ENV: production
            DATABASE_URL: ${COMPOSE_DATABASE_URL:?Use pnpm dev:up or pnpm prod:up}
        depends_on:
            db:
                condition: service_healthy
        networks:
            - starter
        command:
            - node
            - dist/database/migrate.js
volumes:
    db-data: null
    redis-data: null
    search-engine-data: null
    virus-scanner-data: null
    cloudflare-runtime: null
networks:
    starter:
        driver: bridge
    tunnel:
        driver: bridge
